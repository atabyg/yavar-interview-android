name: Build Android APK (v13 bootstrap)

on:
  push:
    branches: [feature/version-13]
    paths:
      - 'v13/**'
      - '.github/workflows/build-apk-v13.yml'
      - 'v12/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bootstrap-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare isolated v13 build workspace
        run: |
          set -euo pipefail
          test -f v12/package.json
          test -f v12/capacitor.config.json
          test -f v13/docs/AUDIT.md
          rm -rf "$RUNNER_TEMP/yavar-v13-build"
          mkdir -p "$RUNNER_TEMP/yavar-v13-build"
          cp -a v12/. "$RUNNER_TEMP/yavar-v13-build/"
          echo "BUILD_DIR=$RUNNER_TEMP/yavar-v13-build" >> "$GITHUB_ENV"
          python3 - "$RUNNER_TEMP/yavar-v13-build/capacitor.config.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p, encoding='utf-8'))
          assert d.get('appId') == 'com.yavarshahrha.interview', 'Unexpected applicationId; refusing to build'
          print('applicationId preserved:', d['appId'])
          PY
      - name: Restore logo and generate Android icons
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          mkdir -p src/assets assets
          if [ ! -f src/assets/logo.png ]; then
            test -f assets/logo/p1.txt
            cat assets/logo/p?.txt | base64 -d > src/assets/logo.png
          fi
          python3 -m pip install --disable-pip-version-check pillow
          python3 -c "from PIL import Image; im=Image.open('src/assets/logo.png'); im.load(); print('logo ok', im.size)"
          python3 make-icons.py
      - name: Generate lockfile for the temporary v12-derived workspace and run tests
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.name='yavar-interview-v13-bootstrap';p.version='13.0.0';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          npm ci --no-audit --no-fund
          npm test
          test -s dist/index.html
      - name: Generate Android project and apply v12 compatibility patches
        env:
          YAVAR_KEYSTORE_B64: ${{ secrets.YAVAR_KEYSTORE_B64 }}
          YAVAR_STORE_PASSWORD: ${{ secrets.YAVAR_STORE_PASSWORD }}
          YAVAR_KEY_ALIAS: ${{ secrets.YAVAR_KEY_ALIAS }}
          YAVAR_KEY_PASSWORD: ${{ secrets.YAVAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          npx cap add android
          npx capacitor-assets generate --android
          bash patch-android.sh
          npx cap sync android
          bash patch-v12.sh
          python3 - android/app/build.gradle <<'PY'
          import re, sys
          p=sys.argv[1]
          s=open(p,encoding='utf-8').read()
          s=re.sub(r'(?m)^\\s*versionCode\\s+\\d+', '        versionCode 13', s, count=1)
          s=re.sub(r'(?m)^\\s*versionName\\s+[\"\\'][^\"\\']+[\"\\']', '        versionName "13.0.0"', s, count=1)
          if not re.search(r'(?m)^\\s*versionCode\\s+13\\s*$',s): raise SystemExit('versionCode 13 missing')
          if not re.search(r'(?m)^\\s*versionName\\s+[\"\\']13\\.0\\.0[\"\\']\\s*$',s): raise SystemExit('versionName 13.0.0 missing')
          open(p,'w',encoding='utf-8').write(s)
          PY
          python3 - android/app/src/main/java <<'PY'
          from pathlib import Path
          import sys
          files=list(Path(sys.argv[1]).rglob('MainActivity.java'))
          if len(files)!=1: raise SystemExit(f'Expected one MainActivity.java, got {len(files)}')
          s=files[0].read_text(encoding='utf-8')
          a=s.find('registerPlugin(OfflineWhisperPlugin.class);')
          b=s.find('super.onCreate(savedInstanceState);')
          if a<0 or b<0 or a>b: raise SystemExit('OfflineWhisper registration must precede super.onCreate')
          if 'registerPlugin(SharedInboxPlugin.class);' not in s: raise SystemExit('SharedInbox plugin not registered')
          print('Plugin registration order verified')
          PY
      - name: Build and verify bootstrap APK
        env:
          YAVAR_KEYSTORE_B64: ${{ secrets.YAVAR_KEYSTORE_B64 }}
          YAVAR_STORE_PASSWORD: ${{ secrets.YAVAR_STORE_PASSWORD }}
          YAVAR_KEY_ALIAS: ${{ secrets.YAVAR_KEY_ALIAS }}
          YAVAR_KEY_PASSWORD: ${{ secrets.YAVAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$BUILD_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd "$BUILD_DIR"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BT/aapt" dump badging "$APK" | grep -q "package: name='com.yavarshahrha.interview' versionCode='13' versionName='13.0.0'"
          "$BT/apksigner" verify --verbose "$APK"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/yavar-interview-v13-bootstrap.apk"
          sha256sum "$GITHUB_WORKSPACE/artifacts/yavar-interview-v13-bootstrap.apk" | tee "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"
          if [[ -n "${YAVAR_KEYSTORE_B64:-}" && -n "${YAVAR_STORE_PASSWORD:-}" && -n "${YAVAR_KEY_ALIAS:-}" && -n "${YAVAR_KEY_PASSWORD:-}" ]]; then
            echo 'Stable signing: enabled' | tee "$GITHUB_WORKSPACE/artifacts/signing-status.txt"
          else
            echo 'Stable signing: disabled; upgrade compatibility is not guaranteed' | tee "$GITHUB_WORKSPACE/artifacts/signing-status.txt"
          fi
      - name: Upload bootstrap artifact (not a release build)
        uses: actions/upload-artifact@v6
        with:
          name: yavar-interview-v13-bootstrap-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  ubuntu-26-04-readiness:
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Check shell syntax and runner runtime
        run: |
          set -euo pipefail
          node --version
          bash -n v12/patch-android.sh
          bash -n v12/patch-v12.sh
          git diff --check
          echo 'Non-blocking runner readiness checks passed.'
