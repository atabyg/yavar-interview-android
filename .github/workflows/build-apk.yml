name: Build Android APK (V3 branch)
run-name: Build V3 debug APK

on:
  push:
    branches:
      - feature/offline-ai-interview-v2
      - feature/interview-v3-live-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web sources
        run: |
          set -euo pipefail
          rm -rf app _zip
          mkdir app
          cp -r src app/src
          if [ -d public ]; then cp -r public app/public; fi
          cp -r android-build/. app/
          test -f app/src/components/interview/views.tsx
          test -f app/src/lib/interview/rules.ts
          test -f app/src/lib/interview/ai-assist.ts
      - name: Install dependencies and build web app
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f dist/index.html
      - name: Add and patch Android project
        working-directory: app
        run: |
          npx cap add android
          bash patch-android.sh
          npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk yavar-interview-v3-debug.apk
          ls -l yavar-interview-v3-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: yavar-interview-v3-debug-apk
          path: yavar-interview-v3-debug.apk
          if-no-files-found: error
